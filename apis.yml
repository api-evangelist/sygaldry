name: Sygaldry
description: Sygaldry Technologies builds quantum-accelerated AI servers — augmenting
  classical data-center infrastructure with quantum processors purpose-built for AI
  to deliver exponential speedups on specific training and inference tasks. Founded
  in 2024 in Ann Arbor, Michigan by Chad Rigetti (founder of Rigetti Computing), Idalia
  Friedson, and Michael Keiser, the company combines multiple qubit types within a
  single fault-tolerant architecture to accelerate model training, fine-tuning, and
  token generation while cutting compute cost and energy use. A Y Combinator Spring
  2025 company, Sygaldry has raised $139M ($34M seed led by Initialized Capital and
  a $105M Series A led by Breakthrough Energy Ventures, with Bloomberg Beta among its
  investors). Sygaldry currently publishes no public developer API; this profile is
  maintained for API Evangelist network discovery.
